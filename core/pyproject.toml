[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mixer"
version = "0.1.0"
description = "Real-time audio mixing: rooms, jitter buffers, a 50 Hz mix clock"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest"]
