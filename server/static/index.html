<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Audio Mixer</title>
</head>
<body>
<h1 id="title">Audio Mixer</h1>
<p id="hint"></p>
<button id="start">Start</button>
<button id="stop" disabled>Stop</button>
<pre id="log"></pre>
<script>
'use strict';
const params = new URLSearchParams(location.search);
const mode = params.get('mode');

const SAMPLE_RATE = 16000;      // must match mixer/constants.py
const SAMPLES_PER_FRAME = 320;  // 20 ms at 16 kHz
const FRAME_MS = 20;

const startBtn = document.getElementById('start');
const stopBtn = document.getElementById('stop');

function log(msg) {
  document.getElementById('log').textContent += msg + '\n';
}

function setRunning(running) {
  startBtn.disabled = running;
  stopBtn.disabled = !running;
}

function wsUrl(path) {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  return proto + '://' + location.host + path;
}

// Float samples in [-1, 1] -> int16, the wire format.
function floatToInt16(floats) {
  const ints = new Int16Array(floats.length);
  for (let i = 0; i < floats.length; i++) {
    const s = Math.max(-1, Math.min(1, floats[i]));
    ints[i] = s < 0 ? s * 32768 : s * 32767;
  }
  return ints;
}

function int16ToFloat(ints) {
  const floats = new Float32Array(ints.length);
  for (let i = 0; i < ints.length; i++) {
    floats[i] = ints[i] / 32768;
  }
  return floats;
}

let ctx = null;
let ws = null;
let timer = null;

function startPublish() {
  let freq = parseFloat(params.get('freq') || '440');
  if (!Number.isFinite(freq) || freq <= 0) freq = 440;
  const device = params.get('device') || 'tone-' + freq;
  ctx = new AudioContext({ sampleRate: SAMPLE_RATE });
  log('AudioContext sample rate: ' + ctx.sampleRate);
  ws = new WebSocket(wsUrl('/ws/publish?device=' + encodeURIComponent(device)));
  ws.binaryType = 'arraybuffer';
  let phase = 0;  // continuous across frames so the tone has no clicks
  ws.onopen = () => {
    log('publishing ' + freq + ' Hz as "' + device + '"');
    timer = setInterval(() => {
      const floats = new Float32Array(SAMPLES_PER_FRAME);
      for (let i = 0; i < SAMPLES_PER_FRAME; i++) {
        floats[i] = 0.25 * Math.sin(2 * Math.PI * freq * phase++ / SAMPLE_RATE);
      }
      ws.send(floatToInt16(floats).buffer);  // 320 samples = 640 bytes
    }, FRAME_MS);
  };
}

function startMonitor() {
  ctx = new AudioContext({ sampleRate: SAMPLE_RATE });
  log('AudioContext sample rate: ' + ctx.sampleRate);
  ws = new WebSocket(wsUrl('/ws/monitor'));
  ws.binaryType = 'arraybuffer';
  let playhead = 0;
  ws.onopen = () => log('monitoring');
  ws.onmessage = (event) => {
    const floats = int16ToFloat(new Int16Array(event.data));
    const buffer = ctx.createBuffer(1, floats.length, SAMPLE_RATE);
    buffer.copyToChannel(floats, 0);
    const source = ctx.createBufferSource();
    source.buffer = buffer;
    source.connect(ctx.destination);
    // Schedule chunks back to back; after a gap, restart slightly ahead
    // of "now" so the next chunk is not already in the past.
    playhead = Math.max(playhead, ctx.currentTime + 0.05);
    source.start(playhead);
    playhead += buffer.duration;
  };
}

function stop() {
  if (timer) clearInterval(timer);
  timer = null;
  if (ws) ws.close();
  ws = null;
  if (ctx) ctx.close();
  ctx = null;
  setRunning(false);
}

if (mode === 'publish' || mode === 'monitor') {
  document.getElementById('title').textContent = 'Audio Mixer — ' + mode;
  startBtn.onclick = () => {
    (mode === 'publish' ? startPublish : startMonitor)();
    setRunning(true);
  };
  stopBtn.onclick = stop;
} else {
  document.getElementById('hint').textContent = 'Open with ?mode=publish or ?mode=monitor';
  startBtn.disabled = true;
}
</script>
</body>
</html>
