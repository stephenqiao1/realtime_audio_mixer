<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Audio Mixer</title>
<style>
:root {
  --fg: #1a1a1a; --bg: #ffffff; --line: #999;
  --muted: #667; --accent: #2563eb; --err: #b91c1c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --fg: #e6e6e6; --bg: #131313; --line: #555;
    --muted: #99a; --accent: #60a5fa; --err: #f87171;
  }
}
body {
  color: var(--fg); background: var(--bg);
  font-family: system-ui, sans-serif;
  max-width: 40rem; margin: 2rem auto; padding: 0 1rem;
}
h1 { font-size: 1.25rem; }
button {
  background: none; border: 0.5px solid var(--line);
  color: var(--fg); padding: 0.35rem 0.9rem; cursor: pointer;
}
button:disabled { opacity: 0.4; cursor: default; }
input {
  background: none; border: 0.5px solid var(--line);
  color: var(--fg); padding: 0.35rem 0.5rem;
}
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.row { display: flex; align-items: center; gap: 0.6rem; margin: 0.9rem 0; }
.top { justify-content: space-between; }
.error { color: var(--err); }
.muted { color: var(--muted); }
.meter { width: 10rem; height: 0.6rem; border: 0.5px solid var(--line); }
.meter > div { height: 100%; width: 0%; background: var(--accent); }
#statsDetail table { border-collapse: collapse; margin-top: 0.5rem; }
#statsDetail th, #statsDetail td {
  border: 0.5px solid var(--line); padding: 0.15rem 0.6rem; text-align: right;
}
#recordings { list-style: none; padding: 0; }
#recordings li { display: flex; align-items: center; gap: 0.6rem; margin: 0.4rem 0; }
summary { cursor: pointer; }
#log { font-size: 0.8rem; }
</style>
</head>
<body>
<h1>Audio Mixer</h1>

<div id="viewLobby">
  <div class="row">
    <label for="nameInput">Name</label>
    <input id="nameInput" placeholder="your name" maxlength="24">
  </div>
  <div class="row">
    <button id="createBtn">Create room</button>
    <span class="muted">or</span>
    <input id="codeInput" class="mono" placeholder="CODE" maxlength="4" size="6"
           autocapitalize="characters">
    <button id="joinBtn">Join</button>
  </div>
  <p id="lobbyError" class="error"></p>
</div>

<div id="viewRoom" style="display:none">
  <div class="row top">
    <span>Room <strong id="roomCodeEl" class="mono"></strong>
      <button id="copyBtn">copy</button></span>
    <button id="leaveBtn">Leave</button>
  </div>
  <p id="connBanner" class="error" style="display:none">
    disconnected <button id="rejoinBtn">Rejoin</button>
    <span id="rejoinError"></span></p>
  <div class="row">
    <span class="muted">source</span>
    <label><input type="radio" name="source" value="mic" checked> Microphone</label>
    <label><input type="radio" name="source" value="file"> Test file</label>
    <input type="file" id="fileInput" accept=".wav,audio/wav,audio/*"
           style="display:none">
  </div>
  <div class="row" id="samplesRow" style="display:none">
    <span class="muted">samples</span>
    <button class="sampleBtn mono" data-name="speaker_a.wav">speaker_a.wav</button>
    <button class="sampleBtn mono" data-name="speaker_b.wav">speaker_b.wav</button>
  </div>
  <div class="row">
    <button id="recordBtn">Record</button>
    <span class="muted">mic</span>
    <div class="meter"><div id="micMeter"></div></div>
  </div>
  <div class="row">
    <button id="playBtn">Pause</button>
    <span class="muted">mix</span>
    <div class="meter"><div id="mixMeter"></div></div>
  </div>
  <p>Devices: <span id="devicesEl" class="mono"></span></p>
  <details>
    <summary id="statsSummary" class="mono">0 fps · 0 drops</summary>
    <div id="statsDetail"></div>
  </details>
  <p class="muted">Recordings</p>
  <ul id="recordings"></ul>
</div>

<pre id="log" class="muted"></pre>
<script>
'use strict';
const SAMPLE_RATE = 16000;      // must match mixer/constants.py
const SAMPLES_PER_FRAME = 320;  // 20 ms at 16 kHz
const FRAME_MS = 20;

const el = (id) => document.getElementById(id);

function log(msg) {
  el('log').textContent += msg + '\n';
}

function wsUrl(path) {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  return proto + '://' + location.host + path;
}

function int16ToFloat(ints) {
  const floats = new Float32Array(ints.length);
  for (let i = 0; i < ints.length; i++) {
    floats[i] = ints[i] / 32768;
  }
  return floats;
}

function setMeter(id, frame) {
  let peak = 0;
  for (let i = 0; i < frame.length; i++) {
    const v = Math.abs(frame[i]);
    if (v > peak) peak = v;
  }
  el(id).style.width = (peak / 32768 * 100) + '%';
}

// Runs on the audio thread: accumulate the 128-sample blocks the worklet
// receives into 320-sample frames, convert to int16, post each frame to the
// main thread. Worklets have their own scope, so the float->int16 clamp is
// defined here rather than shared with page code.
const workletSource = `
class FrameSender extends AudioWorkletProcessor {
  constructor() {
    super();
    this.buffer = new Float32Array(${SAMPLES_PER_FRAME});
    this.filled = 0;
  }
  process(inputs) {
    const input = inputs[0][0];
    if (!input) return true;
    let offset = 0;
    while (offset < input.length) {
      const take = Math.min(${SAMPLES_PER_FRAME} - this.filled, input.length - offset);
      this.buffer.set(input.subarray(offset, offset + take), this.filled);
      this.filled += take;
      offset += take;
      if (this.filled === ${SAMPLES_PER_FRAME}) {
        const ints = new Int16Array(${SAMPLES_PER_FRAME});
        for (let i = 0; i < ints.length; i++) {
          const s = Math.max(-1, Math.min(1, this.buffer[i]));
          ints[i] = s < 0 ? s * 32768 : s * 32767;
        }
        this.port.postMessage(ints.buffer, [ints.buffer]);
        this.filled = 0;
      }
    }
    return true;
  }
}
registerProcessor('frame-sender', FrameSender);
`;
const workletUrl = URL.createObjectURL(
  new Blob([workletSource], { type: 'application/javascript' }));

// State machine: lobby -> joining -> in-room -> left. One view at a time:
// the room view only for in-room (connected or not), the lobby otherwise.
let state = 'lobby';
let connected = false;
let ctx = null, ws = null, stream = null;
let playhead = 0;
let roomCode = null;
let recording = false;
let playing = true;
let framesThisSecond = 0, fps = 0, statsTimer = null, recordingCount = 0;
let sourceKind = 'mic';
let micChain = null;
let fileBuffer = null, filePos = 0, fileTimer = null;

function setState(next) {
  state = next;
  el('viewLobby').style.display = state === 'in-room' ? 'none' : 'block';
  el('viewRoom').style.display = state === 'in-room' ? 'block' : 'none';
  el('createBtn').disabled = el('joinBtn').disabled = state === 'joining';
  el('connBanner').style.display =
    state === 'in-room' && !connected ? 'block' : 'none';
}

function deviceName() {
  return el('nameInput').value.trim() ||
         'mic-' + Math.random().toString(36).slice(2, 6);
}

function stopMedia() {
  if (statsTimer) clearInterval(statsTimer);
  statsTimer = null;
  stopMic();
  stopFileStream();
  if (ws) { ws.onclose = null; ws.close(); }
  ws = null;
  if (ctx) ctx.close();
  ctx = null;
  recording = false;
  el('recordBtn').textContent = 'Record';
  setSourceControlsEnabled(true);
  el('micMeter').style.width = '0%';
  el('mixMeter').style.width = '0%';
}

function onSocketLost() {
  // Unexpected close: hold the room view, offer rejoin. Never the lobby.
  stopMedia();
  connected = false;
  setState('in-room');
}

function handleControl(msg) {
  if (msg.event === 'join' || msg.event === 'leave') {
    el('devicesEl').textContent = msg.participants.join(', ');
    log(msg.event + ': ' + msg.device);
  } else if (msg.event === 'recording') {
    addRecording(msg.recording_id);
  } else if (msg.event === 'stats') {
    renderStats(msg);
  }
}

function addRecording(id) {
  recordingCount += 1;
  const name = 'mixer-' + roomCode + '-' + recordingCount + '.wav';
  const url = '/api/rooms/' + encodeURIComponent(roomCode) +
              '/recordings/' + encodeURIComponent(id);
  const item = document.createElement('li');
  const label = document.createElement('span');
  label.className = 'mono';
  label.textContent = name;
  const audio = document.createElement('audio');
  audio.controls = true;
  audio.src = url;
  const save = document.createElement('a');
  save.href = url;
  save.download = name;
  save.textContent = 'download';
  item.append(label, audio, save);
  el('recordings').prepend(item);  // newest first
}

function renderStats(msg) {
  el('statsSummary').textContent = fps + ' fps · ' + msg.dropped + ' drops';
  const rows = Object.entries(msg.devices).map(([device, s]) =>
    '<tr><td class="mono" style="text-align:left">' + device + '</td>' +
    '<td>' + s.depth + '</td><td>' + s.underruns + '</td>' +
    '<td>' + s.overruns + '</td></tr>').join('');
  el('statsDetail').innerHTML =
    '<table><tr><th style="text-align:left">device</th><th>depth</th>' +
    '<th>underruns</th><th>drops</th></tr>' + rows + '</table>';
}

function playFrame(buffer) {
  const ints = new Int16Array(buffer);
  framesThisSecond += 1;
  if (!playing) {
    el('mixMeter').style.width = '0%';
    return;
  }
  setMeter('mixMeter', ints);
  const floats = int16ToFloat(ints);
  const audioBuffer = ctx.createBuffer(1, floats.length, SAMPLE_RATE);
  audioBuffer.copyToChannel(floats, 0);
  const source = ctx.createBufferSource();
  source.buffer = audioBuffer;
  source.connect(ctx.destination);
  // Back to back; after a gap, restart slightly ahead of "now" so the
  // next chunk is not already in the past.
  playhead = Math.max(playhead, ctx.currentTime + 0.05);
  source.start(playhead);
  playhead += audioBuffer.duration;
}

function setSourceControlsEnabled(enabled) {
  document.querySelectorAll('input[name="source"]')
    .forEach((radio) => { radio.disabled = !enabled; });
  el('fileInput').disabled = !enabled;
  document.querySelectorAll('.sampleBtn')
    .forEach((btn) => { btn.disabled = !enabled; });
}

async function startMic() {
  stream = await navigator.mediaDevices.getUserMedia({
    audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true }
  });
  const source = ctx.createMediaStreamSource(stream);
  const sender = new AudioWorkletNode(ctx, 'frame-sender');
  sender.port.onmessage = (event) => {
    setMeter('micMeter', new Int16Array(event.data));
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(event.data);
  };
  source.connect(sender);
  // The audio graph is only pulled if it reaches the destination; without
  // this the worklet never runs. It writes no output, so nothing is audible.
  sender.connect(ctx.destination);
  micChain = { source, sender };
}

function stopMic() {
  if (stream) stream.getTracks().forEach((t) => t.stop());
  stream = null;
  if (micChain) {
    micChain.source.disconnect();
    micChain.sender.disconnect();
    micChain = null;
  }
}

function startFileStream() {
  if (!fileBuffer) {
    log('pick a WAV file to stream');
    return;
  }
  const samples = fileBuffer.getChannelData(0);
  // Absolute deadline like the server clock: late ticks resync instead of
  // bursting, and error never accumulates the way setInterval drifts.
  let deadline = performance.now() + FRAME_MS;
  const pump = () => {
    const frame = new Int16Array(SAMPLES_PER_FRAME);
    for (let i = 0; i < SAMPLES_PER_FRAME; i++) {
      const s = Math.max(-1, Math.min(1, samples[(filePos + i) % samples.length]));
      frame[i] = s < 0 ? s * 32768 : s * 32767;
    }
    filePos = (filePos + SAMPLES_PER_FRAME) % samples.length;  // loop at EOF
    setMeter('micMeter', frame);
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(frame.buffer);
    deadline += FRAME_MS;
    const delay = deadline - performance.now();
    if (delay < 0) deadline = performance.now();
    fileTimer = setTimeout(pump, Math.max(0, delay));
  };
  fileTimer = setTimeout(pump, FRAME_MS);
}

function stopFileStream() {
  if (fileTimer) clearTimeout(fileTimer);
  fileTimer = null;
}

async function applySource(kind) {
  stopMic();
  stopFileStream();
  sourceKind = kind;
  el('fileInput').style.display = kind === 'file' ? 'inline' : 'none';
  el('samplesRow').style.display = kind === 'file' ? 'flex' : 'none';
  el('micMeter').style.width = '0%';
  if (!ws) return;
  if (kind === 'mic') {
    try {
      await startMic();
    } catch (err) {
      // Plain-HTTP LAN pages cannot use the mic; joining still succeeds so
      // the test-file source stays reachable.
      log('microphone unavailable (' + err + ') — try the Test file source');
    }
  } else {
    startFileStream();
  }
}

async function joinRoom(code, device) {
  ctx = new AudioContext({ sampleRate: SAMPLE_RATE });
  if (ctx.sampleRate !== SAMPLE_RATE) {
    log('warning: AudioContext runs at ' + ctx.sampleRate + ' Hz, not ' +
        SAMPLE_RATE + ' — audio is sent unresampled and will be mis-pitched');
  }
  await ctx.audioWorklet.addModule(workletUrl);
  roomCode = code;
  playhead = 0;
  ws = new WebSocket(wsUrl('/ws/room/' + encodeURIComponent(code) +
                           '?device=' + encodeURIComponent(device)));
  ws.binaryType = 'arraybuffer';
  ws.onmessage = (event) => {
    if (typeof event.data === 'string') {
      handleControl(JSON.parse(event.data));
    } else {
      playFrame(event.data);
    }
  };
  ws.onclose = onSocketLost;
  await applySource(sourceKind);
  statsTimer = setInterval(() => {
    fps = framesThisSecond;
    framesThisSecond = 0;
    if (ws && ws.readyState === WebSocket.OPEN) ws.send('stats');
  }, 1000);
  el('roomCodeEl').textContent = code;
  connected = true;
  setState('in-room');
}

async function tryJoin(code, errTarget, fallback) {
  // fallback: where to land if the join fails — 'lobby' from the lobby,
  // 'in-room' from the rejoin banner (never bounce a rejoiner to the lobby).
  if (fallback === 'lobby') setState('joining');
  el('rejoinBtn').disabled = true;
  try {
    const resp = await fetch('/api/rooms/' + encodeURIComponent(code));
    if (!resp.ok) {
      el(errTarget).textContent = 'no such room: ' + code;
      setState(fallback);
      return;
    }
    await joinRoom(code, deviceName());
  } catch (err) {
    el(errTarget).textContent = 'join failed: ' + err;
    stopMedia();
    setState(fallback);
  } finally {
    el('rejoinBtn').disabled = false;
  }
}

el('createBtn').onclick = async () => {
  el('lobbyError').textContent = '';
  setState('joining');
  try {
    const resp = await fetch('/api/rooms', { method: 'POST' });
    const body = await resp.json();
    await joinRoom(body.room_code, deviceName());
  } catch (err) {
    el('lobbyError').textContent = 'create failed: ' + err;
    setState('lobby');
  }
};

el('joinBtn').onclick = () => {
  el('lobbyError').textContent = '';
  const code = el('codeInput').value.trim().toUpperCase();
  if (code.length !== 4) {
    el('lobbyError').textContent = 'room codes are 4 characters';
    return;
  }
  tryJoin(code, 'lobbyError', 'lobby');
};

el('rejoinBtn').onclick = () => {
  el('rejoinError').textContent = '';
  tryJoin(roomCode, 'rejoinError', 'in-room');
};

el('leaveBtn').onclick = () => {
  stopMedia();
  connected = false;
  roomCode = null;
  setState('left');  // renders the lobby; the name input keeps its value
};

el('copyBtn').onclick = () => {
  navigator.clipboard.writeText(roomCode)
    .then(() => log('room code copied'))
    .catch(() => log('copy failed — code: ' + roomCode));
};

el('recordBtn').onclick = () => {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  recording = !recording;
  el('recordBtn').textContent = recording ? 'Stop recording' : 'Record';
  setSourceControlsEnabled(!recording);  // source is fixed while recording
  ws.send(recording ? 'record:start' : 'record:stop');
};

el('playBtn').onclick = () => {
  playing = !playing;
  el('playBtn').textContent = playing ? 'Pause' : 'Play';
};

document.querySelectorAll('input[name="source"]').forEach((radio) => {
  radio.onchange = () => applySource(radio.value);
});

document.querySelectorAll('.sampleBtn').forEach((btn) => {
  btn.onclick = async () => {
    if (!ctx) {
      log('join a room before loading a sample');
      return;
    }
    try {
      const resp = await fetch('/samples/' + btn.dataset.name);
      if (!resp.ok) {
        log('sample unavailable: HTTP ' + resp.status);
        return;
      }
      fileBuffer = await ctx.decodeAudioData(await resp.arrayBuffer());
      filePos = 0;
      log('loaded sample ' + btn.dataset.name +
          ' (' + fileBuffer.duration.toFixed(1) + 's)');
      if (sourceKind === 'file') {
        stopFileStream();
        startFileStream();
      }
    } catch (err) {
      log('sample load failed: ' + err);
    }
  };
});

el('fileInput').onchange = async () => {
  const file = el('fileInput').files[0];
  if (!file) return;
  if (!ctx) {
    log('join a room before picking a file');
    return;
  }
  try {
    // decodeAudioData resamples to the context rate (16 kHz), so any WAV
    // the browser can decode arrives in our wire format.
    fileBuffer = await ctx.decodeAudioData(await file.arrayBuffer());
  } catch (err) {
    log('could not decode ' + file.name + ': ' + err);
    return;
  }
  filePos = 0;
  log('loaded ' + file.name + ' (' + fileBuffer.duration.toFixed(1) + 's' +
      (fileBuffer.numberOfChannels > 1 ? ', using first channel' : '') + ')');
  if (sourceKind === 'file') {
    stopFileStream();
    startFileStream();
  }
};
</script>
</body>
</html>
