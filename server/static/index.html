<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Audio Mixer</title>
</head>
<body>
<h1>Audio Mixer</h1>
<div id="lobby">
  <button id="create">Create room</button>
  <input id="codeInput" placeholder="CODE" maxlength="4" size="6">
  <button id="join">Join</button>
</div>
<div id="roomView" style="display:none">
  <h2 id="roomTitle"></h2>
  <p>In the room: <span id="participants"></span></p>
  <p id="rate"></p>
  <p id="warning" style="color:#c00"></p>
  <button id="leave">Leave</button>
  <button id="record">Record</button>
  <div id="meter" style="width:240px;height:12px;border:1px solid #888;margin:8px 0">
    <div id="meterFill" style="height:100%;width:0%;background:#3a3"></div>
  </div>
  <ul id="recordings"></ul>
</div>
<pre id="log"></pre>
<script>
'use strict';
const params = new URLSearchParams(location.search);

const SAMPLE_RATE = 16000;      // must match mixer/constants.py
const SAMPLES_PER_FRAME = 320;  // 20 ms at 16 kHz

// Random suffix so two tabs don't collide in the room's per-device
// state; override with ?device=<id>.
const device = params.get('device') || 'mic-' + Math.random().toString(36).slice(2, 6);

const codeInput = document.getElementById('codeInput');
const recordBtn = document.getElementById('record');

function log(msg) {
  document.getElementById('log').textContent += msg + '\n';
}

function wsUrl(path) {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  return proto + '://' + location.host + path;
}

function int16ToFloat(ints) {
  const floats = new Float32Array(ints.length);
  for (let i = 0; i < ints.length; i++) {
    floats[i] = ints[i] / 32768;
  }
  return floats;
}

// Runs on the audio thread: accumulate the 128-sample blocks the worklet
// receives into 320-sample frames, convert to int16, post each frame to the
// main thread. Worklets have their own scope, so the float->int16 clamp is
// defined here rather than shared with page code.
const workletSource = `
class FrameSender extends AudioWorkletProcessor {
  constructor() {
    super();
    this.buffer = new Float32Array(${SAMPLES_PER_FRAME});
    this.filled = 0;
  }
  process(inputs) {
    const input = inputs[0][0];
    if (!input) return true;
    let offset = 0;
    while (offset < input.length) {
      const take = Math.min(${SAMPLES_PER_FRAME} - this.filled, input.length - offset);
      this.buffer.set(input.subarray(offset, offset + take), this.filled);
      this.filled += take;
      offset += take;
      if (this.filled === ${SAMPLES_PER_FRAME}) {
        const ints = new Int16Array(${SAMPLES_PER_FRAME});
        for (let i = 0; i < ints.length; i++) {
          const s = Math.max(-1, Math.min(1, this.buffer[i]));
          ints[i] = s < 0 ? s * 32768 : s * 32767;
        }
        this.port.postMessage(ints.buffer, [ints.buffer]);
        this.filled = 0;
      }
    }
    return true;
  }
}
registerProcessor('frame-sender', FrameSender);
`;
const workletUrl = URL.createObjectURL(
  new Blob([workletSource], { type: 'application/javascript' }));

let ctx = null;
let ws = null;
let stream = null;
let playhead = 0;
let roomCode = null;
let recording = false;

function updateMeter(frame) {
  let peak = 0;
  for (let i = 0; i < frame.length; i++) {
    const v = Math.abs(frame[i]);
    if (v > peak) peak = v;
  }
  document.getElementById('meterFill').style.width = (peak / 32768 * 100) + '%';
}

function playFrame(buffer) {
  const floats = int16ToFloat(new Int16Array(buffer));
  const audioBuffer = ctx.createBuffer(1, floats.length, SAMPLE_RATE);
  audioBuffer.copyToChannel(floats, 0);
  const source = ctx.createBufferSource();
  source.buffer = audioBuffer;
  source.connect(ctx.destination);
  // Schedule chunks back to back; after a gap, restart slightly ahead
  // of "now" so the next chunk is not already in the past.
  playhead = Math.max(playhead, ctx.currentTime + 0.05);
  source.start(playhead);
  playhead += audioBuffer.duration;
}

function addRecordingPlayer(id) {
  const list = document.getElementById('recordings');
  const item = document.createElement('li');
  item.textContent = 'recording ' + (list.children.length + 1) + ' ';
  const audio = document.createElement('audio');
  audio.controls = true;
  audio.src = '/api/rooms/' + encodeURIComponent(roomCode) +
              '/recordings/' + encodeURIComponent(id);
  item.appendChild(audio);
  list.appendChild(item);
}

function handleControl(msg) {
  if (msg.event === 'join' || msg.event === 'leave') {
    document.getElementById('participants').textContent = msg.participants.join(', ');
    log(msg.event + ': ' + msg.device);
  } else if (msg.event === 'recording') {
    addRecordingPlayer(msg.recording_id);
  }
}

function leaveRoom() {
  if (stream) stream.getTracks().forEach((t) => t.stop());
  stream = null;
  if (ws) {
    ws.onclose = null;
    ws.close();
  }
  ws = null;
  if (ctx) ctx.close();
  ctx = null;
  recording = false;
  recordBtn.textContent = 'Record';
  document.getElementById('meterFill').style.width = '0%';
  document.getElementById('participants').textContent = '';
  document.getElementById('roomView').style.display = 'none';
  document.getElementById('lobby').style.display = 'block';
}

async function joinRoom(code) {
  stream = await navigator.mediaDevices.getUserMedia({
    audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true }
  });
  ctx = new AudioContext({ sampleRate: SAMPLE_RATE });
  log('AudioContext sample rate: ' + ctx.sampleRate);
  document.getElementById('rate').textContent =
    'AudioContext: ' + ctx.sampleRate + ' Hz';
  if (ctx.sampleRate !== SAMPLE_RATE) {
    document.getElementById('warning').textContent =
      'Warning: AudioContext runs at ' + ctx.sampleRate + ' Hz, not ' +
      SAMPLE_RATE + ' Hz — audio is sent unresampled and will play at the wrong pitch.';
  }
  await ctx.audioWorklet.addModule(workletUrl);
  roomCode = code;
  playhead = 0;
  ws = new WebSocket(wsUrl('/ws/room/' + encodeURIComponent(code) +
                           '?device=' + encodeURIComponent(device)));
  ws.binaryType = 'arraybuffer';
  ws.onmessage = (event) => {
    if (typeof event.data === 'string') {
      handleControl(JSON.parse(event.data));
    } else {
      playFrame(event.data);
    }
  };
  ws.onclose = (event) => {
    if (event.code === 4404) log('unknown room: ' + code);
    leaveRoom();
  };
  const source = ctx.createMediaStreamSource(stream);
  const sender = new AudioWorkletNode(ctx, 'frame-sender');
  sender.port.onmessage = (event) => {
    updateMeter(new Int16Array(event.data));
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(event.data);
  };
  source.connect(sender);
  // The audio graph is only pulled if it reaches the destination; without
  // this the worklet never runs. It writes no output, so nothing is audible.
  sender.connect(ctx.destination);
  document.getElementById('roomTitle').textContent = 'Room ' + code;
  document.getElementById('lobby').style.display = 'none';
  document.getElementById('roomView').style.display = 'block';
}

document.getElementById('create').onclick = async () => {
  try {
    const resp = await fetch('/api/rooms', { method: 'POST' });
    const body = await resp.json();
    await joinRoom(body.room_code);
  } catch (err) {
    log('create failed: ' + err);
    leaveRoom();
  }
};

document.getElementById('join').onclick = async () => {
  const code = codeInput.value.trim().toUpperCase();
  if (!code) {
    log('enter a room code first');
    return;
  }
  try {
    const resp = await fetch('/api/rooms/' + encodeURIComponent(code));
    if (!resp.ok) {
      log('no such room: ' + code);
      return;
    }
    await joinRoom(code);
  } catch (err) {
    log('join failed: ' + err);
    leaveRoom();
  }
};

document.getElementById('leave').onclick = leaveRoom;

recordBtn.onclick = () => {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  recording = !recording;
  recordBtn.textContent = recording ? 'Stop recording' : 'Record';
  ws.send(recording ? 'record:start' : 'record:stop');
};

if (params.get('room')) {
  codeInput.value = params.get('room').toUpperCase();
}
</script>
</body>
</html>
