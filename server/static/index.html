<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Audio Mixer</title>
</head>
<body>
<h1 id="title">Audio Mixer</h1>
<p id="hint"></p>
<p id="rate"></p>
<p id="warning" style="color:#c00"></p>
<button id="start">Start</button>
<button id="stop" disabled>Stop</button>
<div id="meter" style="width:240px;height:12px;border:1px solid #888;margin:8px 0;display:none">
  <div id="meterFill" style="height:100%;width:0%;background:#3a3"></div>
</div>
<pre id="log"></pre>
<script>
'use strict';
const params = new URLSearchParams(location.search);
const mode = params.get('mode');

const SAMPLE_RATE = 16000;      // must match mixer/constants.py
const SAMPLES_PER_FRAME = 320;  // 20 ms at 16 kHz

const startBtn = document.getElementById('start');
const stopBtn = document.getElementById('stop');

// Random suffix so two publish tabs don't collide in the server's per-device
// state; override with ?device=<id>.
const device = mode === 'publish'
  ? (params.get('device') || 'mic-' + Math.random().toString(36).slice(2, 6))
  : null;

function log(msg) {
  document.getElementById('log').textContent += msg + '\n';
}

function setRunning(running) {
  startBtn.disabled = running;
  stopBtn.disabled = !running;
}

function wsUrl(path) {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  return proto + '://' + location.host + path;
}

function int16ToFloat(ints) {
  const floats = new Float32Array(ints.length);
  for (let i = 0; i < ints.length; i++) {
    floats[i] = ints[i] / 32768;
  }
  return floats;
}

// Runs on the audio thread: accumulate the 128-sample blocks the worklet
// receives into 320-sample frames, convert to int16, post each frame to the
// main thread. Worklets have their own scope, so the float->int16 clamp is
// defined here rather than shared with page code.
const workletSource = `
class FrameSender extends AudioWorkletProcessor {
  constructor() {
    super();
    this.buffer = new Float32Array(${SAMPLES_PER_FRAME});
    this.filled = 0;
  }
  process(inputs) {
    const input = inputs[0][0];
    if (!input) return true;
    let offset = 0;
    while (offset < input.length) {
      const take = Math.min(${SAMPLES_PER_FRAME} - this.filled, input.length - offset);
      this.buffer.set(input.subarray(offset, offset + take), this.filled);
      this.filled += take;
      offset += take;
      if (this.filled === ${SAMPLES_PER_FRAME}) {
        const ints = new Int16Array(${SAMPLES_PER_FRAME});
        for (let i = 0; i < ints.length; i++) {
          const s = Math.max(-1, Math.min(1, this.buffer[i]));
          ints[i] = s < 0 ? s * 32768 : s * 32767;
        }
        this.port.postMessage(ints.buffer, [ints.buffer]);
        this.filled = 0;
      }
    }
    return true;
  }
}
registerProcessor('frame-sender', FrameSender);
`;
const workletUrl = URL.createObjectURL(
  new Blob([workletSource], { type: 'application/javascript' }));

let ctx = null;
let ws = null;
let stream = null;

function updateMeter(frame) {
  let peak = 0;
  for (let i = 0; i < frame.length; i++) {
    const v = Math.abs(frame[i]);
    if (v > peak) peak = v;
  }
  document.getElementById('meterFill').style.width = (peak / 32768 * 100) + '%';
}

async function startPublish() {
  stream = await navigator.mediaDevices.getUserMedia({
    audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true }
  });
  ctx = new AudioContext({ sampleRate: SAMPLE_RATE });
  log('AudioContext sample rate: ' + ctx.sampleRate);
  document.getElementById('rate').textContent =
    'AudioContext: ' + ctx.sampleRate + ' Hz';
  if (ctx.sampleRate !== SAMPLE_RATE) {
    document.getElementById('warning').textContent =
      'Warning: AudioContext runs at ' + ctx.sampleRate + ' Hz, not ' +
      SAMPLE_RATE + ' Hz — audio is sent unresampled and will play at the wrong pitch.';
  }
  await ctx.audioWorklet.addModule(workletUrl);
  ws = new WebSocket(wsUrl('/ws/publish?device=' + encodeURIComponent(device)));
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => log('publishing as "' + device + '"');
  const source = ctx.createMediaStreamSource(stream);
  const sender = new AudioWorkletNode(ctx, 'frame-sender');
  sender.port.onmessage = (event) => {
    updateMeter(new Int16Array(event.data));
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(event.data);
  };
  source.connect(sender);
  // The audio graph is only pulled if it reaches the destination; without
  // this the worklet never runs. It writes no output, so nothing is audible.
  sender.connect(ctx.destination);
}

function startMonitor() {
  ctx = new AudioContext({ sampleRate: SAMPLE_RATE });
  log('AudioContext sample rate: ' + ctx.sampleRate);
  ws = new WebSocket(wsUrl('/ws/monitor'));
  ws.binaryType = 'arraybuffer';
  let playhead = 0;
  ws.onopen = () => log('monitoring');
  ws.onmessage = (event) => {
    const floats = int16ToFloat(new Int16Array(event.data));
    const buffer = ctx.createBuffer(1, floats.length, SAMPLE_RATE);
    buffer.copyToChannel(floats, 0);
    const source = ctx.createBufferSource();
    source.buffer = buffer;
    source.connect(ctx.destination);
    // Schedule chunks back to back; after a gap, restart slightly ahead
    // of "now" so the next chunk is not already in the past.
    playhead = Math.max(playhead, ctx.currentTime + 0.05);
    source.start(playhead);
    playhead += buffer.duration;
  };
}

function stop() {
  if (stream) stream.getTracks().forEach((t) => t.stop());
  stream = null;
  if (ws) ws.close();
  ws = null;
  if (ctx) ctx.close();
  ctx = null;
  document.getElementById('meterFill').style.width = '0%';
  setRunning(false);
}

if (mode === 'publish' || mode === 'monitor') {
  document.getElementById('title').textContent = mode === 'publish'
    ? 'Audio Mixer — publish "' + device + '"'
    : 'Audio Mixer — monitor';
  if (mode === 'publish') {
    document.getElementById('meter').style.display = 'block';
  }
  startBtn.onclick = async () => {
    try {
      if (mode === 'publish') {
        await startPublish();
      } else {
        startMonitor();
      }
      setRunning(true);
    } catch (err) {
      log('start failed: ' + err);
      stop();
    }
  };
  stopBtn.onclick = stop;
} else {
  document.getElementById('hint').textContent = 'Open with ?mode=publish or ?mode=monitor';
  startBtn.disabled = true;
}
</script>
</body>
</html>
